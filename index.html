<!DOCTYPE html>
<html>
<head>
    <title>Crop Disease Detection</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f2f9f2;">

    <h1 style="color: #2c6e49;">🌿 Crop Disease Detection</h1>
    <p style="color: #444;">Upload a leaf image to detect plant disease using AI</p>

    <div style="margin: 30px auto; padding: 20px; border: 1px solid #ccc; width: 300px; background: white; border-radius: 10px;">
        <form action="/predict" method="POST" enctype="multipart/form-data">
            <label style="display: block; margin-bottom: 10px; font-weight: bold;">Choose Image:</label>
            <input type="file" name="image" accept="image/*" required style="margin-bottom: 20px;">
            <br>
            <button type="submit" style="padding: 10px 20px; background: #2c6e49; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Detect Disease
            </button>
        </form>
    </div>

    <div style="margin-top: 40px;">
        <h3 style="color: #2c6e49;">🩺 Prediction Result:</h3>
        <p style="color: #666;">(This will show the result from backend)</p>
    </div>

</body>
</html>
